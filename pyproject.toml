[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pocketops"
version = "1.0.0"
description = "Capability-oriented framework for agent-built business automation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "tenacity>=8.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
postgres = ["psycopg2-binary>=2.9"]
ssh = ["paramiko>=3.0"]
slack = ["slack-sdk>=3.0"]
google = ["google-auth>=2.0", "google-api-python-client>=2.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pyright>=1.1"]
all = [
    "playwright>=1.40",
    "psycopg2-binary>=2.9",
    "paramiko>=3.0",
    "slack-sdk>=3.0",
    "google-auth>=2.0",
    "google-api-python-client>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pocketops", "transports", "adapters"]

[tool.pyright]
include = ["pocketops", "transports", "adapters", "drivers", "tests"]
exclude = ["**/__pycache__", ".git", ".mypy_cache"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
reportMissingImports = "error"
reportMissingModuleSource = "none"
reportUnusedImport = "warning"
reportUnusedVariable = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

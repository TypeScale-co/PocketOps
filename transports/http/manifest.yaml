name: http
kind: transport
version: 1.0.0

description: |
  HTTP/HTTPS request transport with authentication, retries,
  pagination, and structured responses.

capabilities:
  - request
  - streaming
  - pagination
  - retry
  - authentication
  - dry-run

supports:
  dry_run: true
  dry_run_method: "Returns request details without executing"

dependencies:
  runtime:
    - python>=3.12
  packages:
    - httpx>=0.28
    - tenacity>=8.0

configuration:
  - name: timeout
    type: float
    default: 30.0
    description: Request timeout in seconds

  - name: max_retries
    type: int
    default: 3
    description: Maximum retry attempts

  - name: retry_statuses
    type: list[int]
    default: [429, 500, 502, 503, 504]
    description: HTTP statuses that trigger retry

authentication:
  - type: bearer
    description: Bearer token in Authorization header
  - type: basic
    description: Basic auth with username/password
  - type: api_key
    description: API key in custom header

trust:
  status: implemented
  last_verified: null
  notes: "Scaffold - implement and verify before use"
